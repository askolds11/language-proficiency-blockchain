services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: language_proficiency_blockchain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Second PostgreSQL instance for the second node
  db2:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: language_proficiency_blockchain
    ports:
      - "5433:5432" # map to a different host port to avoid conflicts
    volumes:
      - pgdata2:/var/lib/postgresql/data

  language-proficiency-blockchain:
    image: language-proficiency-blockchain
    build:
      context: .
      dockerfile: language-proficiency-blockchain/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=db;Port=5432;Database=language_proficiency_blockchain;Username=postgres;Password=postgres
    depends_on:
      - db

  # Second node instance pointing to the second database
  language-proficiency-blockchain-2:
    image: language-proficiency-blockchain
    build:
      context: .
      dockerfile: language-proficiency-blockchain/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=db2;Port=5432;Database=language_proficiency_blockchain;Username=postgres;Password=postgres
    depends_on:
      - db2

volumes:
  pgdata:
  pgdata2:

