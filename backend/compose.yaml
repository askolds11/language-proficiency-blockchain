services:
  language-proficiency-blockchain-db:
    image: postgres:18-alpine
    container_name: language_proficiency_blockchain_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: language_proficiency_blockchain
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql

  language-proficiency-blockchain:
    container_name: language_proficiency_blockchain
    build:
      context: .
      dockerfile: language-proficiency-blockchain/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDb: Host=language-proficiency-blockchain-db;Port=5432;Database=language_proficiency_blockchain;Username=postgres;Password=postgres
    depends_on:
      - language-proficiency-blockchain-db

